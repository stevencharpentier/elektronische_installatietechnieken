<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="500" height="275">
  <!-- input labels -->
  <text x="10" y="35" font-family="Arial, sans-serif" font-size="16" font-weight="bold">A</text>
  <text x="10" y="75" font-family="Arial, sans-serif" font-size="16" font-weight="bold">B</text>
  <text x="10" y="135" font-family="Arial, sans-serif" font-size="16" font-weight="bold">C</text>
  <text x="10" y="175" font-family="Arial, sans-serif" font-size="16" font-weight="bold">D</text>

  <!-- input lines to gate 1 (NAND A,B) -->
  <path d="M30,30 L60,30 L60,50" fill="none" stroke="black" stroke-width="2"/>
  <path d="M30,70 L60,70 L60,50" fill="none" stroke="black" stroke-width="2"/>

  <!-- gate 1: NAND(A,B) -->
  <rect x="60" y="15" width="50" height="70" fill="white" stroke="black" stroke-width="2"/>
  <text x="85" y="56" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold">&amp;</text>
  <circle cx="114" cy="50" r="4" fill="white" stroke="black" stroke-width="2"/>

  <!-- D input to NOT gate -->
  <line x1="30" y1="170" x2="60" y2="170" stroke="black" stroke-width="2"/>

  <!-- gate: NOT(D) -->
  <rect x="60" y="150" width="40" height="40" fill="white" stroke="black" stroke-width="2"/>
  <text x="80" y="176" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold">1</text>
  <circle cx="104" cy="170" r="4" fill="white" stroke="black" stroke-width="2"/>

  <!-- C line and NOT(D) output into gate2 -->
  <line x1="30" y1="130" x2="140" y2="130" stroke="black" stroke-width="2"/>
  <line x1="108" y1="170" x2="140" y2="170" stroke="black" stroke-width="2"/>

  <!-- gate 2: OR(C, NOT D) -->
  <rect x="140" y="115" width="50" height="70" fill="white" stroke="black" stroke-width="2"/>
  <text x="165" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold">&#8805;1</text>

  <!-- gate1 (NAND) output to gate3 -->
  <path d="M118,50 L220,50 L220,80" fill="none" stroke="black" stroke-width="2"/>
  <!-- gate2 (OR) output to gate3 -->
  <path d="M190,150 L220,150 L220,120" fill="none" stroke="black" stroke-width="2"/>

  <!-- gate 3: AND(gate1,gate2) -->
  <rect x="220" y="65" width="50" height="70" fill="white" stroke="black" stroke-width="2"/>
  <text x="245" y="106" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold">&amp;</text>

  <!-- output -->
  <line x1="270" y1="100" x2="310" y2="100" stroke="black" stroke-width="2"/>
  <text x="320" y="105" font-family="Arial, sans-serif" font-size="16" font-weight="bold">X</text>
</svg>
