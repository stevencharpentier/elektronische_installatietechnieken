### Installatieregels
## Van verplicht tot situationeel

---

## Niet elke regel weegt even zwaar

- **Verplicht**: staat in het AREI, kan tot afkeuring leiden
- **Aangeraden**: geen wet, maar vaste sectorpraktijk
- **Suggesties**: comfort-tips, pure voorkeur
- **Situatiegebonden**: enkel geldig in specifieke omstandigheden

---

## Let op met "aangeraden"

- Het AREI eist op sommige plaatsen **"volgens de regels van goed vakmanschap"**: dat is wél een echte wettelijke eis
- Een keurder plaatst in de praktijk ook "aangeraden"-regels vaak onder die noemer
- Strikt genomen **niet correct**: sectorpraktijk ≠ wettelijk "goed vakmanschap", maar hou er rekening mee

---

## Thema: lichtpunten

---

## Lichtpunten
### Wat is een lichtpunt?

Een lichtpunt is **niet** hetzelfde als een lamp

Een groep verlichtingstoestellen bediend door **hetzelfde schakelmechanisme**, ongeacht het aantal lampen

---

## Lichtpunten
### Voorbeelden

- 10 spots, aan/uit vanaf 5 plaatsen (wissel- + kruisschakelaars) = **1 lichtpunt**
- 2 lampen, elk met eigen schakelaar = **2 lichtpunten**
- Schakelpaneel met 3 knoppen, elk een eigen lichtgroep = **3 lichtpunten**

---

## Lichtpunten
### Verplicht

- Minstens **2 afzonderlijke stroombanen** voor verlichting (mag gemengd zijn)
- Zuivere verlichtingskring: **onbeperkt** aantal lichtpunten
- Gemengde kring: elk lichtpunt telt als contactdoos, max. **8** per kring
- Minimale kabeldikte: **1,5 mm²** (max. 10A smeltveiligheid / 16A automaat)

---

## Lichtpunten
### Aangeraden en suggesties

**Aangeraden**
- Aparte verlichtingskring per verdieping/grote zone
- Trapverlichting/gangen op aparte, herkenbare kring

**Suggesties**
- Dimbare kringen voor leefruimtes
- Buitenverlichting op een eigen kring

---

## Lichtpunten
### Situatiegebonden

- Badkamer: bijkomende regels per volume (zie verder)
- Oude installaties (vóór 1/10/1981): mag afwijkend met **1 enkele verlichtingskring**

---

## Thema: stopcontacten en de stopcontactkring

---

## Stopcontacten
### Verplicht

- Max. **8** enkelvoudige/meervoudige stopcontacten per kring
- **Geaard** en **kindveilig**
- Hoogte: min. 15cm (droge ruimte) / 25cm (andere ruimte)
- Kabeldikte: **2,5 mm²**

---

## Telt een vaste USB-lader ook mee?

- Een **vast gemonteerde USB-lader** (wandmodel, geen stekkeradapter) = **1 van de 8 aftakpunten**
- Zelfde logica als: elk lichtpunt telt mee als contactdoos op een gemengde kring
- AREI telt elk **vast aftakpunt**, niet enkel klassieke stopcontacten

---

## Stopcontacten
### Verplicht (vervolg)

- Algemene differentieel: max. **300 mA**, min. 40A nominaal
- Bijkomende differentieel **30 mA** voor badkamer, wasmachine, droogkast, afwasmachine

---

## Stopcontacten
### Aangeraden

Geen wettelijk minimum meer per ruimte, wel vuistregels:

- Woonkamer: **±1 per 4 m²**, vanaf 20m² 10-12 stuks
- Keuken: **±15 stuks**
- Slaapkamer: **min. 3 stuks**
- Elke ruimte: minstens 1 stopcontact

---

## Stopcontacten
### Suggesties en situatiegebonden

**Suggesties**
- USB-stopcontacten bij nachttafel/bureau
- Extra stopcontacten bij vaste tv-/bureau-opstelling

**Situatiegebonden**
- Badkamer: enkel buiten de beschermingsvolumes
- Oude installaties: aanwezige aardingspen moet wel degelijk aangesloten zijn

---

## Thema: verdeelbord

---

## Verdeelbord
### Verplicht

- Klasse I (metaal + aarding) of klasse II (isolerend)
- Deur + vaste achterwand, onbrandbaar
- Bereikbaar, opgehangen op **±1,5m** hoogte
- Elke stroombaan duidelijk gemerkt (zelfde letter als eendraadschema)

---

## Verdeelbord
### Aangeraden en situatiegebonden

**Aangeraden**
- Vrije, gereserveerde plaatsen voor latere uitbreiding (laadpaal, zonnepanelen)

**Situatiegebonden**
- Grote installaties: meerdere verdeelborden, elk met eigen algemene differentieel

---

## Thema: bedrading in het verdeelbord

---

## Bedrading in het verdeelbord
### Verplicht

- Binnenin het bord: **soepele, meeraderige draad** (H07V-K / "VOBst"), niet de massieve draad van de vaste leidingen
- Uiteinden van soepele geleiders: **kabelschoenen (adereindhulzen)** verplicht
- Kabeldikte in het bord: zelfde logica als tabel 4.11, afgestemd op de effectieve stroom (bv. min. 6 mm² tussen hoofdschakelaar en algemene differentieel bij 40A)

---

## Bedrading in het verdeelbord
### Aangeraden en suggesties

**Aangeraden**
- Kleurcode ook in het bord consequent aanhouden
- Voldoende lengtereserve per draad voor latere vervanging

**Suggesties**
- Kabelgoten/-kanalen voor een nette, uitbreidbare bedrading

---

## Wat is een kam?

- **Kamrail / aansluitkam / verdeelkam**: een koperen rail met pennen/vorken
- Klikt bovenop een rij automaten of een differentieel
- Voedt ze **allemaal in één keer** vanuit dezelfde fase(n)
- Alternatief voor losse soepele bruggen met adereindhulzen tussen elk toestel

---

## Kam - aandachtspunten

- **Steekmaat** (afstand tussen de pennen) afgestemd op de breedte van het toestel
- **Koperdoorsnede** bepaalt de max. stroom (bv. 10 mm² → ±63A, 16 mm² → ±80A)
- Bij inkorten: **eindkapje** op het afgezaagde uiteinde
- Ongebruikte pennen: afdekken met **blindstroken**

---

## Thema: zware verbruikers

---

## Zware verbruikers
### Verplicht

- Vast (of vast opgesteld) toestel ≥ **2600 W**: eigen, exclusief toegewezen stroombaan
- Geldt voor: wasmachine, vaatwasser, droogkast, fornuis/kookplaat/oven, boiler, vaste verwarming
- Kabeldikte afgestemd op het effectieve vermogen van het toestel

---

## Zware verbruikers
### Verplicht (vervolg)

- Wasmachine/vaatwasser/droogkast: bijkomend **30 mA**-differentieel
- Vaste verwarming verzonken in vloer/materialen: eigen **100 mA**-differentieel
- Laadpunt elektrisch voertuig: eigen stroombaan + eigen beveiliging, **differentieel type B** (of type A + ingebouwde 6mA DC-detectie)
- Meerdere laadpunten achter 1 gemeenschappelijke differentieel: die moet sowieso type B zijn

---

## Zware verbruikers
### Situatiegebonden

- Warmtepomp: zelfde regels, exact vermogen/opstelling bepaalt de uitvoering per geval
- Airconditioning: aparte automaat hangt af van het vermogen (al dan niet boven 2600 W)

---

## Thema: aarding en equipotentiaalverbinding

---

## Aarding en equipotentiaalverbinding
### Verplicht

- Aardingsweerstand: **altijd < 100 Ω**, gestreefd naar **max. 30 Ω**
- Aardingslus (nieuwbouw): min. 60cm diep, min. 35 mm² koper
- Aardgeleider: min. **16 mm²**
- Hoofdequipotentiaalverbinding: **6 mm²**

---

## Aarding en equipotentiaalverbinding
### Badkamer en situatiegebonden

- Badkamer/stortbad: **bijkomende** equipotentiaalverbinding tussen alle gelijktijdig aanraakbare metalen delen (2,5 of 4 mm²)
- Bestaande gebouwen zonder aardingslus: aardelektrodes ("aardingspinnen") toegelaten
- Oude installaties: hoofd-/bijkomende equipotentiaalverbinding mag ontbreken

---

## Aarding
### Let op, praktijkkloof

- Aardingslus **verplicht** bij nieuwbouw (fundering ≥ 60cm), maar in de praktijk toch geregeld pinnen: lus vergeten voor het storten, of uit gemak
- Mag enkel na een **uitdrukkelijke uitzondering** bij het erkend keuringsorganisme
- Zonder die uitzondering: strikt genomen een inbreuk

---

## Thema: leidingen

---

## Leidingen
### Minimale doorsnede

| Gebruik | Doorsnede |
|---|---|
| Sturing/domotica | 0,5 mm² |
| Verlichting | 1,5 mm² |
| Stopcontacten | 2,5 mm² |
| Gemengde kring | 2,5 mm² |
| Fornuis/wasmachine 3-fazig | 4 mm² |
| Fornuis/wasmachine 1-fazig | 6 mm² |

---

## Leidingen
### Kleurcode (verplicht)

- **Blauw**: uitsluitend voor de nulgeleider
- **Geel-groen**: uitsluitend voor beschermingsgeleider/equipotentiaal
- Geel of groen (los of gecombineerd) voor andere geleiders: **verboden**

---

## Mogen alle fasen dezelfde kleur hebben?

- Strikt gelezen: **ja**, AREI legt enkel N (blauw) en PE (geel-groen) vast
- Bruin/zwart/grijs voor L1/L2/L3 is een **conventie**, geen harde eis
- **Toch sterk afgeraden**: risico op per ongeluk 2 fasen verbinden = gevaarlijke 400V-kortsluiting
- Een keurder kan dit alsnog als een probleem van vakmanschap zien

---

## Leidingen
### Massief vs. soepel in de muur

- Vaste leidingen in de muur: normaal **massief/eendradig** (VOB, XVB)
- **Soepele draad** toegelaten, mits bijkomende bescherming (buis) + kabelschoenen
- **Snoeren** (voor stekkertoestellen) mogen nooit als vaste leiding dienen

---

## Leidingen
### Brandreactieklasse Eca/Cca

- Sinds AREI 2020: elke kabel moet een minimale **CPR-brandklasse** halen
- **Afzonderlijk** geïnstalleerd (meest courant): minimum **Eca**
- **In bundel of in laag** geïnstalleerd: minimum **Cca-s3,d2,a3**
- Een hogere klasse dan het minimum mag altijd

---

## Leidingen
### Halogeenvrij verplicht (situatiegebonden)

- **Cca-s1,d2,a1** (halogeenvrij) verplicht in: evacuatiewegen (behalve binnen de wooneenheid zelf), lokalen voor 50+ personen, tunnels, moeilijk evacueerbare ruimtes
- Voor een gewone woning speelt dit normaal **niet**

---

## Let op: CCA ≠ Cca

- **CCA** (hoofdletters): geleidermateriaal, aluminium kern + koperen laag, hogere weerstand, risico op slechte verbinding
- **Cca** (kleine letters): brandreactieklasse, zie hierboven
- Identiek ogende afkorting, **volledig andere betekenis**

---

## Thema: badkamer en andere natte ruimtes

---

## Badkamer en natte ruimtes
### Verplicht

- Indeling in **volumes** (0, 1, 1bis, 2, 3), elk met eigen toegelaten materieel
- Leidingen in de volumes: **geen metalen omhulsel**
- Bijkomende differentieel 30mA + bijkomende equipotentiaalverbinding verplicht

---

## Badkamer en natte ruimtes
### Situatiegebonden

- Oude installaties: geen bijkomende differentieel/equipotentiaal nodig, maar volume 2 wordt uitgebreid tot 1m
- Sauna's en zwembaden: eigen volume-indeling, gelijkaardige logica

---

## Thema: schakelaars

---

## Schakelaars
### Verplicht

- **Enkelpolig** toegelaten als de stroombaan begint met een **tweepolige automaat**
- **Dubbelpolig** verplicht als de stroombaan begint met **smeltzekeringen**
- Enkelpolige schakelaar onderbreekt steeds de **actieve geleider**, nooit N

---

## Schakelaars
### Geen badkamerregel (meer)

- Dit is gekoppeld aan het type beveiliging, **niet** aan de badkamer specifiek
- Huidig AREI legt géén aparte dubbelpolige-plicht voor badkamers meer op
- Ouder lesmateriaal vermeldt dit soms nog: dat is intussen achterhaald

---

## Samengevat

- **Verplicht** = AREI, geen ruimte voor interpretatie
- **Aangeraden** = sectorpraktijk, sterk gevolgd maar niet wettelijk
- **Suggesties** = comfort, vrije keuze
- **Situatiegebonden** = afhankelijk van ruimte, ouderdom, toestellen
