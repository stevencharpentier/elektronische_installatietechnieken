### Het AREI
## Algemeen Reglement op de Elektrische Installaties

---

## Wat is het AREI?

- Belgische wetgeving die de veiligheidsvoorschriften vastlegt voor elke elektrische installatie
- Heeft **kracht van wet**: niet vrijblijvend, verplicht voor elke installateur en keurder

---

## Drie boeken

- **Boek 1**: laagspanning en zeer lage spanning (huishoudelijk en niet-huishoudelijk)
- **Boek 2**: hoogspanning
- **Boek 3**: transmissie en distributie van elektrische energie

In deze cursus werken we bijna uitsluitend met **Boek 1**

---

## Waar komt het AREI vandaan?

- Opgesteld door de **FOD Economie**, vastgelegd via een Koninklijk Besluit
- Oorspronkelijk van 1981, volledig herschikt door het KB van 8 september 2019
- Nieuwe structuur (Boek 1, 2, 3) van kracht sinds **1 juni 2020**
- Sindsdien verder aangepast, o.a. via het KB van 5 maart 2023 en het KB van 3 oktober 2024

---

## Waarom bestaat het AREI?

- Bescherming van mensen en goederen tegen de risico's van elektriciteit
- Elektrocutie, brand en schade aan toestellen voorkomen
- Legt minimale, afdwingbare veiligheidsvoorschriften vast
- Een installatie die niet voldoet, kan afgekeurd worden en aansprakelijkheid met zich meebrengen

---

## Waarom moet je erin kunnen zoeken?

- **De regels veranderen**: wat je vandaag kent, kan morgen gewijzigd zijn
- Steunen op verouderde kennis kan een installatie doen afkeuren bij de keuring
- **Niemand kent alle details uit het hoofd**: honderden artikels in Boek 1
- Een goede installateur weet waar hij het juiste artikel snel terugvindt

---

## Hoe lees je de nummering?

**Boek > Deel > Hoofdstuk > Afdeling > Onderafdeling > Artikel**

- Een **Deel** is de grootste onderverdeling binnen een boek (Boek 1 telt negen delen)
- Een **Hoofdstuk** wordt genummerd als `deel.hoofdstuk`, bv. Hoofdstuk 4.3
- Een **Afdeling/Onderafdeling** wordt genummerd als `deel.hoofdstuk.afdeling.onderafdeling`, bv. 4.3.3.7

---

## Praktijkvraag 1
### Schakelaar dicht bij een douche

Je wil in een badkamer een gewone lichtschakelaar plaatsen op 50 cm van de douche, buiten de douche zelf.

Mag dit zomaar, of moet je rekening houden met iets specifieks op die afstand?

<details>
<summary>Antwoord tonen</summary>

Rond een bad of douche gelden vaste **volumes** (0, 1, 2, 3) met elk hun eigen regels over welk materieel er toegelaten is. Op 50 cm van de douche bevind je je mogelijk nog in volume 1 of 2, waar niet zomaar elk type schakelaar geplaatst mag worden. Je moet dus eerst bepalen in welk volume je zit voor je de schakelaar plaatst.

**Locatie**: Hoofdstuk 7.1, afdeling 7.1.3 - Classificatie van de volumes

</details>

---

## Praktijkvraag 2
### Verlichtingskring ombouwen naar stopcontact

Ik heb een verlichtingskring met een automaat van 16A, de kabels zijn 2,5 mm².

Mag dit? En mag ik hier een stopcontact op aansluiten in plaats van een licht?

<details>
<summary>Antwoord tonen</summary>

**Kabeldikte en beveiliging**: ja, dit mag. Voor een kabel van 2,5 mm² staat tabel 4.11 een smeltveiligheid tot 16A of een automatische schakelaar tot 20A toe. Een automaat van 16A blijft dus ruim binnen de toegelaten grens.

**Stopcontact in plaats van licht**: ja, dit mag ook, maar dan gelden de regels voor stopcontactenkringen: elk verlichtingstoestel op die kring telt mee als een contactdoos, en per stroombaan zijn maximaal 8 contactdozen (of gelijkgestelde lichtpunten) toegelaten. De volledige installatie moet daarnaast minstens twee afzonderlijke stroombanen voor verlichting behouden.

**Locatie**: tabel 4.11 in onderafdeling 4.4.1.5 (kabeldikte/beveiliging), onderafdeling 5.3.5.2.b - Stopcontacten en verlichting (mengen van stopcontacten en lichtpunten)

</details>

---

## Praktijkvraag 3
### Zelf sleutelen aan het verdeelbord

Tijdens het labo wil een student, zonder enige opleiding elektriciteit, zelfstandig de bedrading in een verdeelbord aanpassen.

Mag dit, of is hier iets specifieks voor nodig?

<details>
<summary>Antwoord tonen</summary>

Neen. Enkel personen met de juiste codificatie, **BA4 (gewaarschuwd)** of **BA5 (vakbekwaam)**, mogen werken aan een elektrische installatie uitvoeren. Een student zonder deze codificatie mag dit niet zelfstandig doen.

**Locatie**: Deel 9, Hoofdstuk 9.2 - Toekenning van de codificatie BA4/BA5, en Hoofdstuk 9.3 - Werken aan elektrische installaties

</details>

---

## Praktijkvraag 4
### Stopcontact naast een buitenzwembad

Je wil een stopcontact plaatsen op 1 meter van de rand van een buitenzwembad.

Mag dit zomaar?

<details>
<summary>Antwoord tonen</summary>

Neen. Rond een zwembad gelden ook volumes: volume 1 loopt tot 2m van de rand van het bekken, volume 2 tot 3,5m (telkens tot 2,5m hoogte). Op 1m van de rand bevind je je nog in volume 1, waar enkel materieel op zeer lage veiligheidsspanning toegelaten is. Een gewoon stopcontact mag hier niet zomaar geplaatst worden.

**Locatie**: Hoofdstuk 7.2, afdeling 7.2.2 - Classificatie van de volumes, en afdeling 7.2.3 - Bescherming tegen elektrische schokken

</details>

---

## Praktijkvraag 5
### Wasmachine in de badkamer

Je plaatst een wasmachine in de badkamer. De installatie heeft al een differentieelstroominrichting van 300mA aan het begin van de installatie.

Volstaat dit voor de wasmachine?

<details>
<summary>Antwoord tonen</summary>

Neen. Toestellen zoals wasmachines, droogkasten en afwasmachines in een badkamer of stortbadzaal moeten bijkomend beschermd worden door een differentieelstroominrichting met grote of zeer grote gevoeligheid (maximaal 30mA), naast de algemene 300mA-inrichting aan het begin van de installatie.

**Locatie**: onderafdeling 4.2.4.3, punt c

</details>

---

## Praktijkvraag 6
### Uitbreiding van een bestaande installatie

Je voegt een extra stroombaan toe aan een bestaande verdeelkast in een woning.

Moet deze uitbreiding gekeurd worden voor je ze in gebruik neemt?

<details>
<summary>Antwoord tonen</summary>

Ja. Een wijziging of uitbreiding van een elektrische installatie moet, net als een volledig nieuwe installatie, onderworpen worden aan een gelijkvormigheidscontrole door een erkend organisme vóór de ingebruikname.

**Locatie**: Deel 6, Hoofdstuk 6.4 - Gelijkvormigheidscontrole vóór de ingebruikname

</details>

---

## Praktijkvraag 7
### Eendraadschema en situatieplan

Je legt een nieuwe huisinstallatie aan, maar maakt er geen eendraadschema of situatieplan van, "dat kost te veel tijd".

Mag dit?

<details>
<summary>Antwoord tonen</summary>

Neen. Het eendraadschema en het situatieplan maken verplicht deel uit van het dossier van de elektrische installatie en moeten toegevoegd worden aan het verslag van de gelijkvormigheidscontrole. Ontbreken ze, dan is dit een inbreuk.

**Locatie**: Hoofdstuk 2.12 - Schema's, plannen en documenten van elektrische installaties, en afdeling 9.1.2 - Dossier van de elektrische installatie

</details>

---

## Praktijkvraag 8
### Zonnepanelen op een woning

Je plaatst een fotovoltaïsche installatie van 8 kVA op een eengezinswoning.

Gelden hiervoor gewoon dezelfde regels als voor de rest van de huisinstallatie, of is er iets specifieks?

<details>
<summary>Antwoord tonen</summary>

Er is iets specifieks: huishoudelijke fotovoltaïsche installaties op laagspanning tot en met 10 kVA hebben een eigen hoofdstuk met bijkomende voorschriften, bovenop de algemene regels van de rest van het Boek.

**Locatie**: Hoofdstuk 7.112 - Huishoudelijke fotovoltaïsche installaties op laagspanning (≤ 10 kVA)

</details>
