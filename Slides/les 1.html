## Labo reglement
### Lokaal ELL.01.02 (Smart Lab)

- Halverwege het labo ligt een **rode lijn**. Hier niet over zonder geslaagd te zijn voor de labo Digitap test
- De rood gearceerde gebieden mogen enkel door een lector betreden worden
- De elektriciteitskasten worden enkel gebruikt of geopend na toestemming van de lector
- De schakelaar naast de elektriciteitskasten mag enkel door een lector bediend worden, of door een student na uitdrukkelijke toestemming

---
## Labo reglement
### Materiaal en veiligheid

- Kabels correct van lengte maken, losliggende kabels netjes leggen om struikelgevaar te vermijden
- Gereedschap zoals krimptangen, kabeltesters en schroevendraaiers na afloop terug op de voorziene plaats leggen
- Schakelmateriaal correct gebruiken en plaatsen, niets lostrekken
- Metalen voorwerpen zoals ringen, kettingen en armbanden verwijderen voor je over de rode lijn gaat

---
## Labo reglement
### Afsluiten en algemeen

- Alle kabels loskoppelen, oprollen en per categorie wegleggen
- Gereedschappen terugleggen, elektriciteitskasten afsluiten
- Geen eten in het labo, drinken in gesloten fles mag
- Respect voor medestudenten en materiaal
- De laatste tien minuten van elk lesmoment zijn voorzien om het labo terug in orde te brengen

---

## Studiewijzer & ECTS
- Bekijk samen de ECTS fiche van het vak
- Studiewijzer beschikbaar op Digitap

---
## Verwachtingen

- Kom naar de les als je wilt opletten, kom niet om spelletjes te spelen
- Als je te laat bent, klop je niet op de deur maar wacht je tot de deur zelf open gaat. Dit kan tot aan de pauze zijn
- Elke student heeft een pen of potlood en papier mee

---
## Verwachtingen
### Gebruik van AI

- Geen gebruik van AI tools
- AI is om mensen te versnellen die het al kunnen
- We bouwen hier geen kastelen op drijfzand

---
## Test logisch denken

Korte test om te peilen of een student extra ondersteuning nodig heeft bij het vak.

Dit is geen examen, maar een hulpmiddel om de klas beter te kunnen begeleiden.

---
## Installatie van software

We installeren samen de software die we doorheen de cursus gebruiken:

- **Siemens Logo** (soft comfort): programmeren en simuleren van digitale logica en Logo schakelingen
- **Trikker**: tekenen van situatieplannen en elektrische installaties
- **diagrams.net**: maken van schema's en eendraadschema's

---
## Start AREI en basisregels

Na de installatie beginnen we met:

- Het **AREI** (Algemeen Reglement op de Elektrische Installaties)
- De basisregels voor een goede en veilige huisinstallatie
